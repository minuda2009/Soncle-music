name: Win debug (temporary)
on:
  push:
    branches: [openhands/win-release-fix]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build (output kept so a failure shows up as an annotation)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          npm run dist:win -- --publish never > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 25 build.log | cut -c1-400 | sed ':a;N;$!ba;s/\r//g;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=dist:win failed::$msg"
          fi
          exit $code
