name: Android APK
# Builds the Android app (mobile/) on GitHub's servers, so no PC with Android Studio is needed.
# The APK appears under the run's "Artifacts".
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'renderer/**', 'src/**', 'assets/**', 'THIRD_PARTY_NOTICES.md', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install and build the web layer
        working-directory: mobile
        run: |
          npm ci
          npm run sync
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: soncle-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
