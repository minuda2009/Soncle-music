name: Build extension

on:
  push:
    branches: ["main"]
    paths:
      - 'extension/**'
      - 'renderer/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Build extension
        run: node extension/build.mjs

      - name: Zip the extension
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          (cd extension/dist && zip -qr "../soncle-companion-$V.zip" .)
          echo "ZIP=extension/soncle-companion-$V.zip" >> "$GITHUB_ENV"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: soncle-companion-zip
          path: ${{ env.ZIP }}

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist
