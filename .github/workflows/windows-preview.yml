name: Windows preview
# Builds the WinUI 3 head (uno/heads/Soncle.Windows) on GitHub's Windows runners and replaces the
# "windows-preview" release with the run-from-folder build, like android-preview.yml does for the
# phone. The Electron app keeps shipping until the port passes the parity checklist
# (docs/WINUI_PLAN.md §4, §10).
on:
  push:
    paths: ['uno/**', '.github/workflows/windows-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

# one build at a time; a newer push replaces a build still running, so an older build never wins
concurrency:
  group: windows-preview
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # Bounds the job (restore, publish, pack); a hung build would hold the concurrency group.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The SDK and the Uno.Sdk version come from uno/global.json.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: uno/global.json
      # A failure here fails the job before anything touches the release, so the windows-preview
      # link keeps pointing at the last good build.
      - name: Publish the Soncle.Windows head
        run: dotnet publish uno/heads/Soncle.Windows/Soncle.Windows.csproj -c Release -f net10.0-windows10.0.26100 -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -o publish
      - name: Pack the run-from-folder build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Soncle-preview-win-x64.zip -Force
      # Acceptance 2 is "a window appears": the build must open the shell, not merely compile. Run
      # the packed build (the same bytes the release carries) and report the start-to-window time
      # and the idle working set the Issue asks for (docs/WINUI_PLAN.md §9). A step that fails here
      # fails the job before the release is touched, so a head that no longer starts never replaces
      # the last good preview (acceptance 3).
      - name: Smoke-test the packed build (window, first-frame proxy, working set)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path Soncle-preview-win-x64.zip -DestinationPath smoke -Force
          $exe = Join-Path $PWD 'smoke/Soncle.Windows.exe'
          if (-not (Test-Path $exe)) { throw 'Soncle-preview-win-x64.zip does not contain Soncle.Windows.exe' }
          $zip = Get-Item Soncle-preview-win-x64.zip
          $exeCount = (Get-ChildItem smoke -Filter *.exe).Count
          $dllCount = (Get-ChildItem smoke -Filter *.dll).Count
          Write-Host "packed build: $([math]::Round($zip.Length / 1MB, 1)) MB, $exeCount exe, $dllCount dll"

          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew()
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 250
              $proc.Refresh()
              if ($proc.HasExited -or $proc.MainWindowHandle -ne 0) { break }
            }
            $window = $sw.ElapsedMilliseconds
            if ($proc.HasExited) { throw "Soncle.Windows.exe exited (code $($proc.ExitCode)) before showing a window" }
            if ($proc.MainWindowHandle -eq 0) { throw 'Soncle.Windows.exe showed no window within 90 s' }
            $proc.Refresh()
            Write-Host "start to window: $window ms (first-frame proxy, windows-latest)"
            Write-Host "window title: '$($proc.MainWindowTitle)'"
            Write-Host "working set at idle: $([math]::Round($proc.WorkingSet64 / 1MB, 1)) MB"
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if ($proc.HasExited) { throw 'Soncle.Windows.exe exited within 5 s of showing its window' }
            Write-Host "working set after 5 s: $([math]::Round($proc.WorkingSet64 / 1MB, 1)) MB"
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: soncle-preview-win
          path: Soncle-preview-win-x64.zip
          if-no-files-found: error
      - name: Remove the previous windows-preview release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete windows-preview --yes --cleanup-tag
      - name: Publish the windows-preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create windows-preview Soncle-preview-win-x64.zip --prerelease --target $env:GITHUB_SHA --title "Soncle Preview (Windows, $env:GITHUB_REF_NAME)" --notes "Test build from $env:GITHUB_REF_NAME at $($env:GITHUB_SHA.Substring(0,7)). Unzip Soncle-preview-win-x64.zip and run Soncle.Windows.exe: it installs nothing, keeps its own data and leaves the normal Soncle app and its library untouched. Unsigned, so SmartScreen warns."
